{% load static %}

<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <!--    <meta charset="UTF-8">-->
    <title>Vendor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</head><br>
<h3><center><b><mark>Vendor Dashboard</mark></b></center></h3><br>
<div class="col-md-12 text-center">
    <a href="{% url 'create' %}"><button type="button">Create new package</button></a>
    <a href="{% url 'logout' %}"><button type="button">Logout</button></a>

</div>
<br>
<h4><center><b><mark>Your tour packages</mark></b></center></h4>
<body>
<table border="1">
    <thead>
    <tr>
        <th>Title</th>
        <th>Destination</th>
        <th>Image</th>
        <th>Duration</th>
        <th>Price</th>
        <th>Expiry</th>
    </tr>
    </thead>
    <tbody>
    {% for package in packages %}
    <tr>
        <td>{{ package.title }}</td>
        <td>{{ package.destination }}</td>
        <td><img src="{{package.image.url}}"></td>
        <td>{{ package.duration}}</td>
        <td>{{ package.price}}</td>
        <td>{{ package.expiry}}</td>
        <td>
            <a href="{% url 'edit' package.id %}">Update</a> </td> <td><a href="{% url 'delete_item' package.id %}">Delete</a></td>

    </tr>
    {% endfor %}
    </tbody>
</table>
</body>
<style>
    body{
     background-image: url("{% static 'img/naturee.jpg' %}");
     }
     button{
     background-color:yellow;
       border-radius: 8px;
     }
   h1{text-align:center;}
       table{width:100%;}
       th{height:10px}
       table{text-align:center;}
       table{margin-left: auto;
       background-color:white;
   margin-right: auto;
   width: 1000px;
     }
</style>
</html>
